name: Publish NOTE2 v4.10 runtime from PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'runtime/v4.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/v4.10
          fetch-depth: 0

      - name: Download and verify source
        env:
          SOURCE_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-2694-81fd-b96e-fddef3af564d/raw?se=2026-08-23T12%3A23%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=c19fb0e8-f773-56eb-a828-b0e38dc3b712&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T23%3A34%3A32Z&ske=2026-08-23T23%3A34%3A32Z&sks=b&skv=2026-02-06&sig=DYHjGAgfGN%2B2RhE/vECQJdZgWtBvmco/X683B/Eq9iM%3D"
          EXPECTED_SHA: "abb7fb93e76462983b6625d13f38b1ffb834f50670635e67985a19045fe1f2d2"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$SOURCE_URL" -o /tmp/note2-v410.zip
          echo "$EXPECTED_SHA  /tmp/note2-v410.zip" | sha256sum -c -
          rm -rf /tmp/note2-v410 && mkdir -p /tmp/note2-v410
          unzip -q /tmp/note2-v410.zip -d /tmp/note2-v410
          ROOT=/tmp/note2-v410/note2_v410_work
          test -f "$ROOT/package.json"
          test -f "$ROOT/src/App.jsx"
          test -f "$ROOT/src/styles.css"
          test -f "$ROOT/server.mjs"

      - name: Replace runtime branch contents
        run: |
          set -euo pipefail
          ROOT=/tmp/note2-v410/note2_v410_work
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$ROOT"/. .
          rm -rf scripts/__pycache__ .note2-upload .github
          test -f package.json
          test -f src/App.jsx
          test -f src/styles.css
          test -f server.mjs
          test -d test

      - name: Commit and push v4.10 runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: NOTE2 v4.10 runtime source"
          git push origin HEAD:runtime/v4.10
